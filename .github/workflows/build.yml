name: Compilar v2.26 Windows y Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guardar fuente de 12 modelos activos y respaldo de anteriores
        uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Fuente_Verificacion
          path: |
            desktop/*.py
            desktop/requirements.txt
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r desktop/requirements.txt opencv-python-headless numpy
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Generar cuatro vistas reales de prueba en color y B/N
        run: python desktop/four_proof.py
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_12_Prototipos_Pruebas
          path: dist-prototipos/*
          if-no-files-found: error
          retention-days: 30
      - name: Compilar aplicación con módulos de plano y exportación
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths desktop --hidden-import=win32print --hidden-import=win32ui --hidden-import=win32con --hidden-import=PIL.ImageWin --hidden-import=seat_plan --hidden-import=fitz --collect-submodules=reportlab.graphics.barcode --name ControlEntradas_Windows desktop/control_entradas.py
      - name: Comprobar módulos cargados dentro del EXE real
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\\dist\\ControlEntradas_Windows.exe" -ArgumentList "--check-package" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El EXE no arranca con los módulos Code128 (código $($p.ExitCode))." }
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Windows
          path: dist/ControlEntradas_Windows.exe
          if-no-files-found: error
          retention-days: 30
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Conservar firma de prueba Android entre versiones
        uses: actions/cache@v4
        with:
          path: android/signing/debug.keystore
          key: control-entradas-persistent-debug-signing-v2
      - name: Verificar firma original obligatoria
        shell: bash
        run: |
          test -s android/signing/debug.keystore || { echo "::error::Falta la clave original. Prohibido regenerarla: cambiaría la firma e impediría actualizar sin desinstalar."; exit 1; }
          keytool -list -keystore android/signing/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Instalar SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK debug
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Nombrar archivos sin sufijos
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/ControlEntradas_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Android
          path: dist-android/ControlEntradas_Android.apk
          if-no-files-found: error
          retention-days: 30
