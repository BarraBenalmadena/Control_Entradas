name: Compilar v0.5 Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r desktop/requirements.txt
      - name: Comprobar código
        run: python -m py_compile desktop/control_entradas.py desktop/ticket_printer.py
      - name: Pruebas de control e impresión
        run: |
          python -m pip install opencv-python-headless numpy
          python -m unittest discover -s tests -v
      - name: Compilar EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --hidden-import=win32print --name ControlEntradas_Windows_v0.5 desktop/control_entradas.py
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Windows_v0.5
          path: dist/ControlEntradas_Windows_v0.5.exe
          if-no-files-found: error
          retention-days: 30