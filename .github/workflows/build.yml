name: Compilar v0.1 - Windows y Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r desktop/requirements.txt
      - name: Comprobar código
        run: python -m py_compile desktop/control_entradas.py
      - name: Compilar EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ControlEntradas_Windows_v0.1 desktop/control_entradas.py
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Windows_v0.1
          path: dist/ControlEntradas_Windows_v0.1.exe
          if-no-files-found: error
          retention-days: 30
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK debug de pruebas
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ControlEntradas_Android_v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlEntradas_Android_v0.1
          path: ControlEntradas_Android_v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
